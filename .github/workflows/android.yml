name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 20
      uses: actions/setup-java@v4
      with:
        java-version: '20'
        distribution: 'temurin'
        cache: gradle

    - name: Build Project
      run: npm install ./ && npm run build
    - name: Execute gradlew
      run: cd android && chmod +x gradlew && ./gradlew build
